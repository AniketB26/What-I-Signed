server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through this proxy, so the default 1m body limit would
    # reject files the API itself is willing to accept (20MB).
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached or clients pin to a stale bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Same-origin API proxy. Keeps the refresh-token cookie first-party, so
    # SameSite=Lax works and no CORS preflight is involved.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The query endpoint streams tokens; buffering would defeat it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA history fallback — client-side routes must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
